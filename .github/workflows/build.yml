name: Build Audio Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Since June 2026 the windows-latest image ships Visual Studio 2026 (v18);
      # the old "Visual Studio 17 2022" generator reports "could not find any
      # instance of Visual Studio".
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version | Out-File -FilePath configure.log
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DDREAMY_BUILD_TESTS=ON -DDREAMY_COPY_PLUGIN_AFTER_BUILD=OFF *>> configure.log
          $c = $LASTEXITCODE
          if ($c -ne 0) {
            $msg = (Get-Content configure.log | Select-Object -Last 50) -join '%0A'
            Write-Output "::error::CMake configure failed (exit ${c}):%0A$msg"
            exit $c
          }
          Get-Content configure.log -Tail 5

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --version > configure.log 2>&1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDREAMY_BUILD_TESTS=ON -DDREAMY_COPY_PLUGIN_AFTER_BUILD=OFF >> configure.log 2>&1 || {
            msg=$(tail -n 50 configure.log | sed -e 's/%/%25/g' -e 's/\r$//' -e 's/$/%0A/' | tr -d '\n')
            echo "::error::CMake configure failed:%0A$msg"
            exit 1
          }
          tail -n 5 configure.log

      - name: Build Plugin
        run: cmake --build build --config Release

      - name: Run DSP Tests (Windows)
        if: runner.os == 'Windows'
        run: build\Release\ReverbTests.exe

      - name: Run DSP Tests (macOS)
        if: runner.os == 'macOS'
        run: ./build/ReverbTests

      - name: Ad-hoc sign plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - "build/DreamyReverb_artefacts/Release/AU/Dreamy Reverb.component"
          codesign --force --sign - "build/DreamyReverb_artefacts/Release/VST3/Dreamy Reverb.vst3"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DreamyReverb-${{ matrix.os }}
          path: |
            build/DreamyReverb_artefacts/Release/VST3/*.vst3
            build/DreamyReverb_artefacts/Release/AU/*.component
          if-no-files-found: error

  # The sandbox that reviews these builds cannot download workflow artifacts
  # (Azure blob storage is blocked), so publish the binaries to a git branch
  # that can be fetched with a plain `git fetch`.
  publish:
    name: Publish binaries to branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Push binaries to plugin-binaries branch
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK="$(mktemp -d)"

          if git clone --depth 1 --branch plugin-binaries "$URL" "$WORK" 2>/dev/null; then
            echo "Cloned existing plugin-binaries branch"
          else
            rm -rf "$WORK"
            mkdir -p "$WORK"
            git -C "$WORK" init -q
            git -C "$WORK" checkout -q --orphan plugin-binaries
            git -C "$WORK" remote add origin "$URL"
            echo "Created new plugin-binaries branch"
          fi

          mkdir -p "$WORK/windows" "$WORK/macos"
          if [ -d collected/DreamyReverb-windows-latest ]; then
            cp -a collected/DreamyReverb-windows-latest/. "$WORK/windows/"
          fi
          if [ -d collected/DreamyReverb-macos-latest ]; then
            cp -a collected/DreamyReverb-macos-latest/. "$WORK/macos/"
          fi

          # actions/upload-artifact strips file permissions; restore the
          # executable bit on the Mach-O binaries inside the plugin bundles.
          find "$WORK/macos" -type f -path "*/Contents/MacOS/*" -exec chmod 755 {} + 2>/dev/null || true

          {
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run_id:   ${GITHUB_RUN_ID}"
            echo "commit:   ${GITHUB_SHA}"
            echo "branch:   ${GITHUB_REF_NAME}"
            echo "date:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$WORK/BUILD-INFO.txt"

          git -C "$WORK" add -A
          if git -C "$WORK" -c user.name="github-actions[bot]" \
                     -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                     commit -q -m "CI build ${GITHUB_RUN_ID} (${GITHUB_SHA:0:7})"; then
            git -C "$WORK" push -q origin HEAD:plugin-binaries \
              || git -C "$WORK" push -q --force origin HEAD:plugin-binaries
            echo "Binaries published to plugin-binaries branch"
          else
            echo "No changes to publish"
          fi
